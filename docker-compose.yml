# Top-level Docker Compose for the SIH-2026 lunar image-registration
# pipeline. Each service is its own self-contained microservice; this
# compose file only wires the run-time dependencies between them.

services:
  minio:
    image: minio/minio:latest
    container_name: sih-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - minio_data:/data

  ingestion-svc:
    build:
      context: ./ingestion-svc
      dockerfile: Dockerfile
    container_name: sih-ingestion-svc
    environment:
      INGESTION_HOST: "0.0.0.0"
      INGESTION_PORT: "8080"
      INGESTION_FAKES3_ROOT: "/var/ingestion-fakes3"
      # The fake S3 root is mounted as a volume so files persist.
      # In production, swap this for real S3/MinIO endpoints.
    depends_on:
      minio:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ingestion_fakes3:/var/ingestion-fakes3
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  minio_data:
  ingestion_fakes3:
