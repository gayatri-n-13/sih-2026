services:
  minio:
    image: minio/minio:RELEASE.2024-08-29T01-40-52Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      retries: 10

  ingestion-svc:
    build: ./ingestion-svc
    depends_on:
      minio:
        condition: service_healthy
    environment:
      INGESTION_S3_ENDPOINT_URL: http://minio:9000
      INGESTION_S3_ACCESS_KEY: minioadmin
      INGESTION_S3_SECRET_KEY: minioadmin
      INGESTION_OUTPUT_BUCKET: ingestion-output
      INGESTION_LOG_LEVEL: info
    ports:
      - "8000:8000"
