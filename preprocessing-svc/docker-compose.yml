version: "3.9"

services:
  preprocessing-svc:
    build: .
    image: preprocessing-svc:0.1.0
    container_name: preprocessing-svc
    ports:
      - "8080:8080"
    environment:
      PREPROC_HOST: 0.0.0.0
      PREPROC_PORT: 8080
      PREPROC_OUTPUT_DIR: /var/outputs
      PREPROC_LOCAL_FAKES3: /var/fakes3
    volumes:
      - ./var/outputs:/var/outputs
      - ./var/fakes3:/var/fakes3
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
