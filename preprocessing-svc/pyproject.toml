[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "preprocessing-svc"
version = "0.1.0"
description = "Lunar image preprocessing & illumination-invariant representation microservice"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Member 2" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-image>=0.22",
    "opencv-python-headless>=4.9",
    "zarr>=2.16",
    "numcodecs>=0.12",
    "pillow>=10.0",
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "rasterio>=1.3",
    "xarray>=2024.1",
    "pytest>=8.0",
    "pytest-cov>=4.1",
]

[project.optional-dependencies]
dev = [
    "pytest-cov>=4.1",
    "mypy>=1.8",
]

[project.scripts]
preprocessing-svc = "preprocessing_svc.api:main"
mock-ingestion = "mock_ingestion.generate_mock:main"

[tool.setuptools]
packages = ["preprocessing_svc", "mock_ingestion"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["preprocessing_svc"]
omit = ["preprocessing_svc/pb/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
