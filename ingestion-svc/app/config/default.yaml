# Default field-mapping + validation config for ingestion-svc.
#
# IMPORTANT: this file is the ONLY place that holds label tag names.
# The Python code never references tag names directly — when real Chandrayaan-2
# product labels are inspected, update THIS file (or a per-job override passed
# via IngestRequest.config_ref) and no Python change should be required.
#
# The mapping uses dotted-path notation. The reader is responsible for
# resolving these paths against whatever label format the input has
# (PDS3 KEY=VALUE, PDS4 XML, GeoTIFF metadata, etc.).

field_mapping:
  # Logical field -> label tag to read from
  gsd:                   null   # e.g. "MAP_RESOLUTION" / "PIXEL_SCALE" — fill when known
  acquisition_time:      null   # e.g. "START_TIME" / "PRODUCT_CREATION_TIME"
  sun_azimuth_deg:       null   # e.g. "SUN_AZIMUTH" / "INCIDENCE_ANGLE_AZIMUTH"
  sun_elevation_deg:     null   # e.g. "SUN_ELEVATION" / "INCIDENCE_ANGLE"
  projection:            null   # e.g. "MAP_PROJECTION_TYPE" — fallback "unknown"
  footprint_wkt:         null   # typically null; derived from corners
  bit_depth:             null   # e.g. "SAMPLE_BITS"
  band_count:            null   # rarely in label; usually derived from raster

validation:
  min_band_count: 1
  max_band_count: 16
  reject_all_nan: true
  max_dim: 100000

# Tier-2 ephemeris: list of SPICE kernel filenames (relative to
# $INGESTION_SPICE_KERNELS_DIR). When populated AND tier-1 fields are absent,
# the parser will compute sun angles via spiceypy. Empty by default.
spice_kernels: []

# Optional override; if set, ingestion writes to this bucket instead of
# the one from settings. Useful for per-tenant output isolation.
output_bucket: null
output_prefix_template: null
