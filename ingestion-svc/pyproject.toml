[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --cov=app --cov-report=term-missing"
filterwarnings = [
    "ignore::DeprecationWarning:rasterio",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["app"]
omit = ["app/__init__.py"]
